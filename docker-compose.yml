version: '3.8'

networks:
  dts_net:
    driver: bridge

services:
  # =========================================
  # 1. 数据库 (PostgreSQL)
  # =========================================
  db:
    image: postgres:15
    command: postgres -c "synchronous_commit=off" -c "max_connections=300"
    container_name: dts_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dts_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dts_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: dts_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    environment:
      - REDIS_POOL_SIZE=10
    networks:
      - dts_net

  # =========================================
  # 2. Scheduler (调度中心)
  # =========================================
  scheduler:
    build: .
    image: dts-core:latest
    container_name: dts_scheduler
    command: ["./dts_scheduler"]
    restart: always
    environment:
      - DTS_RUN_MODE=docker
      - DATABASE_URL=postgresql://postgres:password@db:5432/dts_db
      - SCHEDULER_PORT=9090
      - METRICS_PORT=9100 
      - GLOG_logtostderr=1
      - GLOG_v=0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "9090:9090" # gRPC 端口
      - "9100:9100" # Metrics 端口，方便本地 curl 调试
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dts_net

  # =========================================
  # 3. Worker Cluster
  # =========================================
  worker:
    image: dts-core:latest
    restart: always
    deploy:
      replicas: 5
    depends_on:
      - scheduler
    networks:
      - dts_net
    environment:
      - DTS_RUN_MODE=docker
      - SCHEDULER_ADDR=scheduler:9090
      - WORKER_BIND_ADDR=0.0.0.0:50051
      - METRICS_PORT=9101
    
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        export MY_IP=$$(hostname -i)
        export WORKER_ID="worker-$$(hostname)"
        export WORKER_ADVERTISE_ADDR="$$MY_IP:50051"
        echo "🚀 Starting $$WORKER_ID at $$WORKER_ADVERTISE_ADDR..."
        ./dts_worker "$$WORKER_ID"

  # =========================================
  # 4. API Server
  # =========================================
  api-server:
    image: dts-core:latest
    container_name: dts_api_server
    command: ["./dts_api_server"]
    restart: always
    environment:
      - DTS_RUN_MODE=docker
      - DATABASE_URL=postgresql://postgres:password@db:5432/dts_db
      - DTS_PORT=45403
      - METRICS_PORT=9102
      - REDIS_HOST=redis   
      - REDIS_PORT=6379
    ports:
      - "45403:45403"
      - "9102:9102" # Metrics 端口
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dts_net

  # =========================================
  # 5. API Web
  # =========================================
  api-web:
    image: dts-core:latest
    container_name: dts_api_web
    command: ["./dts_api_web"]
    restart: always
    environment:
      - DTS_RUN_MODE=docker
      - SERVER_ADDR=api-server:45403
      - WEB_PORT=8080
      - METRICS_PORT=9103
    ports:
      - "8080:8080"
      - "9103:9103"
    depends_on:
      - scheduler
    networks:
      - dts_net

  # =========================================
  # [新增] 6. Prometheus (监控数据采集)
  # =========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dts_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--enable-feature=remote-write-receiver'
    volumes:
      # 需要在当前目录创建一个 prometheus.yml 文件
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      
    ports:
      - "9091:9090" # 宿主机访问 http://localhost:9091
    networks:
      - dts_net

  # =========================================
  # [新增] 7. Grafana (监控可视化)
  # =========================================
  grafana:
    image: grafana/grafana:10.0.0
    container_name: dts_grafana
    restart: always
    ports:
      - "3000:3000" # 宿主机访问 http://localhost:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # 初始密码
    volumes:
      - grafana_data:/var/lib/grafana # 持久化保存你的仪表盘
    depends_on:
      - prometheus
    networks:
      - dts_net

  k6:
    image: grafana/k6
    volumes:
      - ./load-test:/scripts
    environment:
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
    # 默认不启动，需要压测时手动执行
    entrypoint: /bin/sh
    stdin_open: true
    tty: true
    networks:
      - dts_net

volumes:
  db_data:
  grafana_data: # [新增] Grafana 数据卷