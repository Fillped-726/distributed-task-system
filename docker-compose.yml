version: '3.8'

# 定义一个自定义网络，让所有服务都在同一个网段，可以通过服务名互通
networks:
  dts_net:
    driver: bridge

services:
  # =========================================
  # 1. 数据库 (PostgreSQL)
  # =========================================
  db:
    image: postgres:15
    command: postgres -c "synchronous_commit=off" -c "max_connections=300"
    container_name: dts_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dts_db
    ports:
      - "5433:5432" # 暴露给宿主机，方便你用 Navicat/pgAdmin 查看数据
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dts_net
    # 健康检查：确保数据库完全启动后，C++ 服务再尝试连接（配合 C++ 中的重试逻辑更稳）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: dts_redis
    ports:
      - "6379:6379"
    #以此配置开启 AOF 持久化，防止 Redis 意外挂掉时丢失太多数据
    command: ["redis-server", "--appendonly", "yes"] 
    restart: always
    environment:
      - REDIS_POOL_SIZE=10
    networks:
      - dts_net

  # =========================================
  # 2. Scheduler (调度中心)
  # =========================================
  scheduler:
    build: .             # 使用当前目录的 Dockerfile 构建
    image: dts-core:latest
    container_name: dts_scheduler
    command: ["./dts_scheduler"] # 指定运行 Scheduler
    restart: always
    environment:
      - DTS_RUN_MODE=docker          # 开启纯控制台日志
      - DATABASE_URL=postgresql://postgres:password@db:5432/dts_db
      - SCHEDULER_PORT=9090
      - GLOG_logtostderr=1
      - GLOG_v=0
      - REDIS_HOST=redis  
      - REDIS_PORT=6379
    ports:
      - "9090:9090"      # 暴露 gRPC 端口，供外部调试或 API-Web 连接
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dts_net

  # =========================================
  # Worker Cluster (支持 --scale 扩容)
  # =========================================
  worker:
    image: dts-core:latest
    restart: always

    deploy:
      replicas: 5

    depends_on:
      - scheduler
    networks:
      - dts_net
    environment:
      - DTS_RUN_MODE=docker
      - SCHEDULER_ADDR=scheduler:9090
      - WORKER_BIND_ADDR=0.0.0.0:50051
      # 注意：WORKER_ADVERTISE_ADDR 这里不写死，由下面的 command 动态注入
    
    # [核心黑魔法] 使用 Shell 动态获取容器 IP 和 ID
    entrypoint: ["/bin/sh", "-c"]
    command: 
      - |
        # 1. 获取容器内部 IP (Docker 网络分配的)
        export MY_IP=$$(hostname -i)
        
        # 2. 生成唯一 Worker ID (利用容器的主机名，通常是随机 Hash)
        export WORKER_ID="worker-$$(hostname)"
        
        # 3. 设置回发给 Scheduler 的地址 (IP:Port)
        export WORKER_ADVERTISE_ADDR="$$MY_IP:50051"
        
        echo "🚀 Starting $$WORKER_ID at $$WORKER_ADVERTISE_ADDR..."
        
        # 4. 启动 C++ 程序 (将动态生成的 ID 传进去)
        ./dts_worker "$$WORKER_ID"

  # =========================================
  # 5. API Server (任务提交入口)
  # =========================================
  api-server:
    image: dts-core:latest
    container_name: dts_api_server
    command: ["./dts_api_server"]
    restart: always
    environment:
      - DTS_RUN_MODE=docker
      - DATABASE_URL=postgresql://postgres:password@db:5432/dts_db
      - DTS_PORT=45403
      - REDIS_HOST=redis   
      - REDIS_PORT=6379
    ports:
      - "45403:45403" # 暴露给宿主机，方便你用 Postman 测试提交任务
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dts_net

  # =========================================
  # 6. API Web (前端 HTTP 接口)
  # =========================================
  api-web:
    image: dts-core:latest
    container_name: dts_api_web
    command: ["./dts_api_web"]
    restart: always
    environment:
      - DTS_RUN_MODE=docker
      - SERVER_ADDR=scheduler:9090 # 连接到 Scheduler
      - WEB_PORT=8080
    ports:
      - "8080:8080" 
    depends_on:
      - scheduler
    networks:
      - dts_net

# 数据卷持久化
volumes:
  db_data: