syntax = "proto3";
package dts.service;

import "dts/task/task.proto";
import "dts/task/task_state.proto";
import "dts/error/error.proto";

option go_package = "dts-cli/pkg/proto/service";

message CancelTaskRequest  { string task_id = 1; }
message GetJobStatusRequest {
  string job_id = 1;
  bool include_tasks = 2; 
}
message SubscribeRequest   { string client_id = 1; }
message SubmitDagRequest {          
  string idempotency_key = 1;  
  repeated dts.task.Task tasks = 2; 
  repeated dts.task.TaskEdge edges = 3;
  string client_id = 4;       
}

// *************** 公共应答头 ***************
message RpcRespHeader {
  optional dts.error.Error error = 1;
  string request_id = 2;
}

// *************** 业务响应体 ***************
message SubmitDagResponse {
  RpcRespHeader header = 1;
  string job_id = 2;        
}

message CancelTaskResponse {
  RpcRespHeader header = 1;
  bool success         = 2; // 业务结果
}

message GetJobStatusResponse {
  RpcRespHeader header = 1;
  
  string job_id = 2;
  dts.task.JobState state = 3;
  
  // 进度条相关
  int32 total_tasks = 4;
  int32 finished_tasks = 5;
  
  // 详情列表 (仅当 request.include_tasks = true 时填充)
  repeated dts.task.TaskRuntimeDetail task_details = 6;
  
  // 整个 Job 的提交时间和结束时间
  int64 submit_time = 7;
  int64 finish_time = 8;
}

// 流式返回：同样带公共头
message TaskResult {
  RpcRespHeader header  = 1;
  dts.task.Task task    = 2;
}

// *************** 服务定义 ***************
service TaskService {
  rpc SubmitDag(SubmitDagRequest) returns (SubmitDagResponse);
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  //TODO 仅接口
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ListenResults(SubscribeRequest) returns (stream TaskResult);
}